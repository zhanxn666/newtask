# custom_mffn_yolo.yaml
ch: 15  # input channels
nc: 10  # number of classes
depth_multiple: 0.33 # reduce neck depth
width_multiple: 1.0 # reduce model width

backbone:
  # 0
  - [-1, 1, MFFN_YOLO_Backbone, [64]]           # [B, 64, 384, 384]
  

head:
  # 1
  - [-1, 1, Conv, [128, 3, 2]]       # [B, 128, 192, 192]  P3  #-[input_from, num_blocks, module, [out_channels, kernel, stride, ...]]
  # 2
  - [-1, 1, Conv, [256, 3, 2]]       # [B, 256, 96, 96]    P4
  # 3
  - [-1, 1, Conv, [512, 3, 2]]      # [B, 512, 48, 48]   P5
  # Connect P3, P4, P5: layer indices 1, 2, 3
  - [[1, 2, 3], 1, Detect, [nc]]  # Detect(P3, P4, P5)