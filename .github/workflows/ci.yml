name: CI - Auto Test on Push

on:
  push:
    branches: [ main ]  # 只在 main 分支触发
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]  # 支持你的 Python 版本

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt  # 如果你有 requirements.txt
        pip install flake8 pytest  # lint + 测试工具

    - name: Lint with flake8
      run: |
        # 运行代码检查（自定义规则）
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Run tests with pytest
      run: |
        pytest tests/  # 如果有 tests 文件夹

    - name: Build and check (optional for YOLO)
      run: |
        python -c "import ultralytics; print('YOLO ready!')"  # 简单检查
